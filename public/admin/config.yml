# Throwaway harness config (test-repo backend = no auth, all client-side). Regenerated by cms-dev.
# Exercises the surfaces most fork patches touch: i18n locales, a relation combo, a dropdown-select
# combo (>5 options so it isn't radio-rendered), a hint/description, draft, and markdown.
backend:
  name: test-repo
media_folder: static/images
public_folder: /images
i18n:
  structure: multiple_files
  locales: [en, pt]
  default_locale: en
collections:
  - name: categories
    label: Categories
    folder: content/categories
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, widget: string }
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    slug: '{{slug}}'
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      # P10 inline row: datetime beside a relation-combo and a select — reproduces the row-alignment bug
      - { name: date, label: Date, widget: datetime, date_format: YYYY/MM/DD, time_format: HH:mm, width: '1/3' }
      - { name: category, label: Category, widget: relation, collection: categories, value_field: title, display_fields: [title], search_fields: [title], width: '1/3' }
      - { name: featured_tag, label: Featured tag, widget: select, hint: Pick one tag to feature, options: [Rock, Metal, Jazz, Fado, Indie, Punk], width: '1/3' }
      - { name: body, label: Body, widget: markdown, i18n: true }
